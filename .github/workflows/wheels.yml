name: build wheels

# Builds the manylinux x86_64 wheels + sdist, and (on a v* tag) publishes
# them to PyPI via trusted publishing (OIDC) — no stored token. A plain
# push or workflow_dispatch only builds + uploads artifacts; publishing
# fires only when a version tag is pushed.
#
# PyPI-side setup required once, before the first tag:
#   pypi.org > account > Publishing > add a pending publisher:
#     project=libtab  owner=kiljoy001  repo=py-libtab
#     workflow=wheels.yml  environment=pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: manylinux x86_64 wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # config (build/skip/archs/manylinux image/test-command) lives in
        # pyproject.toml under [tool.cibuildwheel]

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only on a version tag — a plain push / manual dispatch never publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # collect both 'wheels' and 'sdist' into dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
